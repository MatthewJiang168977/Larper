# Defaults target the local k3d cluster. values-aks.yaml overrides for Azure.

# Our own images (api, migrate) are rebuilt under the same :dev tag locally, so the
# node must re-pull every time. With immutable per-commit tags (AKS) use IfNotPresent.
imagePullPolicy: Always

api:
  image: larper-registry:5111/larper-api:dev
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPU: 70

clerk:
  # Public by design (it ships to every browser). The API derives the JWKS URL from it,
  # so no Clerk secret lives in the cluster.
  publishableKey: pk_test_bmF0aW9uYWwtcmVkZmlzaC04MTA0LmNsZXJrLmFjY291bnRzLmRldiQ
  # Origins allowed in a token's azp claim (comma-separated).
  authorizedParties: http://localhost:3001

ingress:
  className: traefik
  host: ""   # empty = match any host (localhost:8080 locally)

postgres:
  # Built from infra/postgres/Dockerfile: CNPG standard image (pgvector) + PostGIS.
  image: larper-registry:5111/larper-postgres:17
  instances: 1
  storage: 2Gi

migrate:
  # Built from db/Dockerfile: golang-migrate + db/migrations.
  image: larper-registry:5111/larper-migrate:dev

workers:
  # Built from workers/Dockerfile: every Go command in one image.
  image: larper-registry:5111/larper-workers:dev
  userEventsPartitions: 6
  tasteReplicas: 2
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { memory: 128Mi }

redis:
  image: redis:7.4-alpine

redpanda:
  image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
  storage: 2Gi
