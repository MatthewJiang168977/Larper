# Defaults target the local k3d cluster. values-aks.yaml overrides for Azure.

# Our own images (api, migrate) are rebuilt under the same :dev tag locally, so the
# node must re-pull every time. With immutable per-commit tags (AKS) use IfNotPresent.
imagePullPolicy: Always

api:
  image: larper-registry:5111/larper-api:dev
  replicas: 2
  # Enables the on-demand CPU profile endpoint on the metrics port.
  cpuProfiling: false
  # Sized from load tests (docs/decisions/0001-hpa-cpu-request.md): a pod uses ~290m
  # at 9 req/s, where p95 is still flat. No CPU limit: CFS throttling at 500m caused
  # the p95 swings. The HPA target is a percentage of the request.
  resources:
    requests: { cpu: 300m, memory: 128Mi }
    limits: { memory: 256Mi }
  # Request limits per client IP and per signed-in user (apps/api/src/throttle/limits.ts),
  # counted in Redis so they hold across replicas; 429 with Retry-After past them.
  # Load tests that drive one user or one IP harder than a person could turn them off
  # with --set api.rateLimit.enabled=false (README, "Load test and monitoring").
  rateLimit:
    enabled: true
    # Where the per-IP limit reads the client's address: "forwarded" (X-Forwarded-For,
    # as far as trustProxy allows) or "cloudflare" (CF-Connecting-IP, set by Cloudflare's
    # edge; believed only from a proxy trustProxy trusts).
    clientIp: forwarded
    # The proxies in front of the API whose X-Forwarded-For is believed: a hop count, or
    # their addresses/CIDRs. Locally one: Traefik (k3d's load balancer passes TCP through).
    trustProxy: "1"
  # Browser origins allowed to call the API cross-origin (the web app: on Vercel in
  # production, the dev server locally). Exact scheme://host[:port], no wildcard: the
  # chart refuses anything else, and each must also be in clerk.authorizedParties (or
  # its tokens are rejected anyway). Empty: no CORS, same-origin only.
  # Where a visitor's location may trigger an area ingest (apps/api/src/quests/ingest-region.ts):
  # "xmin,ymin,xmax,ymax" in degrees (lng,lat,lng,lat). Empty: anywhere.
  ingestRegion: ""
  cors:
    origins: ["http://localhost:3001"]
    # How long a browser may reuse a preflight's answer (Chrome caps it at 7200).
    maxAgeSeconds: 7200
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPU: 60 # 180m per pod: scale out before the ~12-18 req/s per pod knee
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 0
        selectPolicy: Max
        policies:
          - { type: Percent, value: 200, periodSeconds: 15 }
          - { type: Pods, value: 4, periodSeconds: 15 }

clerk:
  # Public by design (it ships to every browser). The API derives the JWKS URL from it,
  # so verifying tokens needs no Clerk secret (only demo.enabled brings one).
  publishableKey: pk_test_bmF0aW9uYWwtcmVkZmlzaC04MTA0LmNsZXJrLmFjY291bnRzLmRldiQ
  # Origins allowed in a token's azp claim (comma-separated).
  authorizedParties: http://localhost:3001

# The public demo's shared account (apps/api/src/demo, scripts/demo-account.sh). On:
# POST /demo/sign-in hands out one-time Clerk sign-in tokens for that one user, and a
# CronJob resets it nightly. Needs the Secret secretName (keys secretKey: the Clerk
# secret key, userId: the demo user's id), which scripts/oci-up.sh creates.
demo:
  enabled: false
  secretName: clerk-demo
  email: ""
  reset:
    # Every night at 04:00 New York time (the demo region's).
    schedule: "0 4 * * *"
    timeZone: America/New_York

ingress:
  className: traefik
  host: ""   # empty = match any host (localhost:8080 locally)

# The API on the internet over HTTPS at ingress.host (templates/public.yaml; on Oracle,
# scripts/oci-up.sh with PUBLIC_HOST: infra/oci-k3s/README.md, "Going public").
public:
  enabled: false
  # The host's certificate, from Let's Encrypt through cert-manager: staging (untrusted,
  # generous rate limits: try it first), production, or off (no certificate: Traefik's
  # self-signed default; the stand-in VM, which the internet can't reach).
  acme: staging
  # ACME account contact. Optional; oci-up.sh passes it from a local file, so it's never
  # in the repo.
  acmeEmail: ""
  # A backstop at Traefik, per client address, before a request reaches Node. The API's
  # own limits (api.rateLimit) stay; these only have to stop a flood cheaply.
  edge:
    rate: { average: 20, burst: 60 } # requests per second
    inFlight: 30                     # concurrent requests
    maxBodyBytes: 65536              # the API takes small JSON bodies only

postgres:
  # Built from infra/postgres/Dockerfile: CNPG standard image (pgvector) + PostGIS.
  image: larper-registry:5111/larper-postgres:17
  instances: 1
  storage: 2Gi
  # Without requests Postgres was BestEffort: the first pod evicted under memory
  # pressure, and nearly no CPU share next to API pods that have no CPU limit.
  # ~230m at light load, ~650-800m at peak (loadtest/results/hpa-*).
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { memory: 1Gi }
  # Extra postgresql.conf settings, e.g. { shared_buffers: 64MB }; CNPG's defaults
  # otherwise. max_connections (CNPG's default is 100) must hold every role's limit
  # below plus reservedConnections, or the chart refuses to render.
  parameters:
    max_connections: "150"
  # A login role per service, granted only what it needs (migration 0010,
  # docs/decisions/0003-service-db-roles.md). pool: the most connections one pod
  # opens. connectionLimit: the role's cap in Postgres. The chart refuses to render
  # unless each cap covers pool x the service's most pods (replicas or the HPA's max,
  # plus a rolling update's 25% surge; ingest one more, for a load-places run).
  roles:
    # Default: API max 6 + 2 surge = 8 pods x 10 = 80.
    api: { pool: 10, connectionLimit: 80 }
    # One pod, Recreate. Uses one connection at a time.
    relay: { pool: 2, connectionLimit: 4 }
    # 2 + 1 surge = 3 pods x 2. Handles one record at a time.
    taste: { pool: 2, connectionLimit: 8 }
    # (2 + 1 surge + load-places) x 4. A job, its lease renewals, the stats refresh.
    ingest: { pool: 4, connectionLimit: 16 }
    # The schema owner: the migrate Job (and psql by hand).
    owner: { connectionLimit: 10 }
    # The hourly backup check: one connection, no grants (templates/backup-check.yaml).
    backup-check: { connectionLimit: 1 }
    # The nightly demo reset: one connection; reads users, deletes quests (migration 0012).
    demo-reset: { connectionLimit: 1 }
  # Connections outside the roles: CNPG's instance manager and the superuser
  # (superuser_reserved_connections is 3).
  reservedConnections: 10
  # Backups to an S3-compatible object store via the Barman Cloud plugin (needs the
  # plugin + cert-manager installed, and a Secret "pg-backup-s3"; scripts/oci-up.sh
  # does both for Oracle). Off locally.
  backup:
    enabled: false
    endpointURL: ""
    bucket: ""
    # Folder in the bucket for this cluster's base backups and WAL. A rebuilt cluster
    # writes to a new one (pg-2, ...) while restoring from the old.
    serverName: pg
    retention: 14d
    archiveTimeout: 1h
    schedule: "0 0 3 * * 0" # weekly base backup, Sunday 03:00 (seconds first)
    # Extra environment for the barman-cloud sidecar, as name: value.
    sidecarEnv: {}
    # Hourly freshness check reporting to a dead-man's switch (templates/backup-check.yaml).
    check:
      enabled: false
      schedule: "17 * * * *"
      # The recovery point. The check's own WAL heartbeat keeps it under ~2 h on a
      # healthy cluster, idle or not.
      walMaxAgeHours: 48
      # Weekly base backups, plus a day.
      baseBackupMaxAgeDays: 8
  # Start from a backup instead of an empty database (infra/oci-k3s/README.md).
  restore:
    enabled: false
    fromServerName: ""

migrate:
  # Built from db/Dockerfile: golang-migrate + db/migrations.
  image: larper-registry:5111/larper-migrate:dev
  # How long the Job waits for the owner's CREATEROLE (or the service roles) before
  # failing with the reason; and the most the whole Job, retries included, may take.
  # A fresh install's first wait includes Postgres's initdb.
  waitForRolesSeconds: 600
  deadlineSeconds: 1200

workers:
  # Built from workers/Dockerfile: every Go command in one image.
  image: larper-registry:5111/larper-workers:dev
  userEventsPartitions: 6
  tasteReplicas: 2
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { memory: 128Mi }

ingest:
  # Built from workers/Dockerfile --target ingest: ingest-worker + DuckDB CLI.
  image: larper-registry:5111/larper-ingest:dev
  replicas: 2
  overtureRelease: "2026-09-23.1"
  leaseSeconds: 120
  # DuckDB's own cap, kept under the container limit so it spills instead of OOMing.
  duckdbMemory: 512MB
  duckdbThreads: 2
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

queue:
  # postgres: the jobs table is the whole queue (local, $0).
  # sqs: Amazon SQS delivers jobs and the jobs table is the ledger (cloud).
  backend: postgres
  sqsPrefix: larper-
  awsRegion: us-east-1
  # How the ingest-worker gets AWS credentials when backend is sqs:
  #   secret       static key from the aws-sqs Secret (AKS, OCI k3s: clusters outside AWS)
  #   podIdentity  EKS Pod Identity, short-lived credentials, nothing stored
  awsAuth: secret

redis:
  image: redis:7.4-alpine

redpanda:
  image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
  storage: 2Gi
  # Seastar's own limits (--smp cores, --memory for the process); the container limit
  # sits above --memory for the allocator's overhead.
  smp: 1
  memory: 512M
  resources:
    requests: { cpu: 100m, memory: 640Mi }
    limits: { memory: 800Mi }

monitoring:
  # Needs kube-prometheus-stack's CRDs (scripts/monitoring.sh). Adds the api
  # ServiceMonitor and the "Larper API" Grafana dashboard.
  enabled: false
