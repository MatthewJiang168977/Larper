# Overrides for the on-demand EKS cluster (infra/terraform/eks): one t4g.large node
# (Graviton, 2 vCPU / 8 GiB). Image repositories and tags are set by
# scripts/eks-up.sh from the ECR registry and the git commit.

# Per-commit tags, so a cached image is always the right one.
imagePullPolicy: IfNotPresent

ingress:
  # Traefik from its Helm chart (eks-up.sh), behind an AWS Network Load Balancer.
  className: traefik

api:
  # At a 300m request about one API pod fits next to the stack on the first node, so
  # the second replica already lands on Karpenter's node; max 6 fits on the two.
  hpa:
    minReplicas: 2
    maxReplicas: 6

postgres:
  storage: 4Gi # gp3 (eks-up.sh makes it the default StorageClass)
  parameters:
    max_connections: "150"
  # Every pod at the HPA's max can get its whole pool: API 6 + 2 surge = 8 pods x 10.
  # One replica each of taste-worker and ingest-worker, + 1 surge. 104 of the 150,
  # plus 10 reserved.
  roles:
    api: { pool: 10, connectionLimit: 80 }
    relay: { pool: 2, connectionLimit: 4 }
    taste: { pool: 2, connectionLimit: 4 }
    ingest: { pool: 4, connectionLimit: 12 }
    owner: { connectionLimit: 10 }

redpanda:
  storage: 4Gi

workers:
  tasteReplicas: 1

ingest:
  replicas: 1

queue:
  backend: sqs
  # The ingest-worker ServiceAccount assumes an IAM role through EKS Pod Identity:
  # no static key in the cluster.
  awsAuth: podIdentity

monitoring:
  enabled: true
