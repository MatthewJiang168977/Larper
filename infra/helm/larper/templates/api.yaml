apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: {{- include "larper.labels" . | nindent 4 }}
spec:
  # With the HPA on, it owns replicas. Setting them here too makes Helm 4's
  # server-side apply fail with a field conflict on every upgrade after a scale.
  {{- if not .Values.api.hpa.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels:
        app: api
        {{- include "larper.labels" . | nindent 8 }}
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: api }
      containers:
        - name: api
          image: {{ .Values.api.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - { name: http, containerPort: 3000 }
            - { name: metrics, containerPort: 9464 }
          env:
            - { name: PORT, value: "3000" }
            - { name: METRICS_PORT, value: "9464" }
            - { name: REDIS_URL, value: "redis://redis:6379" }
            - { name: KAFKA_BROKERS, value: "redpanda:9092" }
            - { name: CLERK_PUBLISHABLE_KEY, value: {{ .Values.clerk.publishableKey | quote }} }
            - { name: CLERK_AUTHORIZED_PARTIES, value: {{ .Values.clerk.authorizedParties | quote }} }
            - { name: RATE_LIMIT_ENABLED, value: {{ ternary "1" "0" .Values.api.rateLimit.enabled | quote }} }
            - { name: CLIENT_IP_SOURCE, value: {{ .Values.api.rateLimit.clientIp | quote }} }
            - { name: TRUST_PROXY, value: {{ .Values.api.rateLimit.trustProxy | quote }} }
            - { name: CORS_ORIGINS, value: {{ include "larper.corsOrigins" . | quote }} }
            - { name: CORS_MAX_AGE_S, value: {{ .Values.api.cors.maxAgeSeconds | quote }} }
            - { name: INGEST_REGION, value: {{ .Values.api.ingestRegion | quote }} }
            {{- if .Values.api.cpuProfiling }}
            # GET :9464/debug/cpu-profile?seconds=30 (metrics port, never routed publicly).
            - { name: CPU_PROFILING, value: "1" }
            {{- end }}
            {{- include "larper.dbEnv" (dict "root" . "role" "api") | nindent 12 }}
          # On delete, SIGTERM and endpoint removal happen concurrently; without this
          # pause the ingress can still route to a pod that already closed its server
          # (seen as a 504 during rollouts).
          lifecycle:
            preStop:
              exec: { command: ["sleep", "5"] }
          readinessProbe:
            httpGet: { path: /readyz, port: 3000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 3000 }
            periodSeconds: 10
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels: { app: api }
spec:
  selector: { app: api }
  # The ingress routes only to "http"; "metrics" is for in-cluster scrapes.
  ports:
    - { name: http, port: 80, targetPort: http }
    - { name: metrics, port: 9464, targetPort: metrics }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  {{- if .Values.public.enabled }}
  # Public (templates/public.yaml): HTTP redirects to HTTPS, the edge backstops run
  # first, and cert-manager keeps the host's certificate in api-tls.
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: >-
      {{ .Release.Namespace }}-https-redirect@kubernetescrd,{{ .Release.Namespace }}-edge-inflight@kubernetescrd,{{ .Release.Namespace }}-edge-rate@kubernetescrd,{{ .Release.Namespace }}-edge-body@kubernetescrd
    {{- if ne .Values.public.acme "off" }}
    cert-manager.io/cluster-issuer: letsencrypt-{{ .Values.public.acme }}
    {{- end }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.public.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: api-tls
  {{- end }}
  rules:
    - {{- with .Values.ingress.host }}
      host: {{ . }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: api, port: { number: 80 } }
{{- if .Values.api.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api }
  minReplicas: {{ .Values.api.hpa.minReplicas }}
  maxReplicas: {{ .Values.api.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ .Values.api.hpa.targetCPU }} }
  {{- with .Values.api.hpa.behavior }}
  behavior: {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
