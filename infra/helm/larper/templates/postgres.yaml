# Managed by the CloudNativePG operator (installed by scripts/bootstrap.sh).
# CNPG creates the secret "pg-app" with the app user's connection URI. Only the migrate
# Job uses it: the services log in as their own roles (managed below).
{{- include "larper.checkConnections" . }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg
spec:
  instances: {{ .Values.postgres.instances }}
  imageName: {{ .Values.postgres.image }}
  storage:
    size: {{ .Values.postgres.storage }}
  resources: {{- toYaml .Values.postgres.resources | nindent 4 }}
  {{- with .Values.postgres.backup }}
  {{- if .enabled }}
  # WAL archiving and base backups through the Barman Cloud plugin (templates/backup.yaml).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: pg-backups
        serverName: {{ .serverName }}
  {{- end }}
  {{- end }}
  {{- if or .Values.postgres.backup.enabled .Values.postgres.parameters }}
  postgresql:
    parameters:
      {{- if .Values.postgres.backup.enabled }}
      # A WAL segment is archived when full or after this long; each one is a few
      # object-store requests, so an idle database at CNPG's 5 min default would use
      # a good part of a 50k-requests/month free tier.
      archive_timeout: {{ .Values.postgres.backup.archiveTimeout | quote }}
      {{- end }}
      {{- range $name, $value := .Values.postgres.parameters }}
      {{ $name }}: {{ $value | quote }}
      {{- end }}
  {{- end }}
  # The roles, as CNPG keeps them: it creates any that are missing, and resets login,
  # attributes, connection limit and password (from the Secret) to these on every
  # reconcile. Grants are the migrations' (0010). A restore brings the roles back.
  managed:
    roles:
      # The owner, from initdb: only the migrate Job logs in as it. CREATEROLE lets
      # migration 0010 create the service roles if CNPG hasn't yet. No passwordSecret:
      # CNPG leaves the password it generated for pg-app alone.
      - name: larper
        login: true
        createrole: true
        connectionLimit: {{ .Values.postgres.roles.owner.connectionLimit }}
        comment: schema owner (migrations)
      {{- range $role, $name := fromYaml (include "larper.dbRoles" .) }}
      - name: {{ $name }}
        login: true
        connectionLimit: {{ (index $.Values.postgres.roles $role).connectionLimit }}
        passwordSecret: { name: pg-{{ $role }} }
        comment: {{ $role }} service
      {{- end }}
  bootstrap:
    {{- if .Values.postgres.restore.enabled }}
    # Rebuild from the object store instead of an empty database (infra/oci-k3s/README.md).
    recovery:
      source: origin
      # Without these CNPG points the pg-app Secret at its default "app" database,
      # not the restored one, and the app migrates an empty database.
      database: larper
      owner: larper
    {{- else }}
    initdb:
      database: larper
      owner: larper
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS postgis;
        - CREATE EXTENSION IF NOT EXISTS vector;
    {{- end }}
  {{- if .Values.postgres.restore.enabled }}
  externalClusters:
    - name: origin
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: pg-backups
          serverName: {{ required "postgres.restore.fromServerName: the backup to restore" .Values.postgres.restore.fromServerName }}
  {{- end }}
