# Kafka topics, created explicitly so partition counts are a decision, not a broker
# default. user.events is keyed by user id: more partitions means more taste-worker
# replicas can share the load, while each user's events stay in order.
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: rpk
          image: {{ .Values.redpanda.image }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              create() { rpk topic create "$1" -p "$2" -r 1 -X brokers=redpanda:9092 || rpk topic describe "$1" -X brokers=redpanda:9092 >/dev/null; }
              create user.events {{ .Values.workers.userEventsPartitions }}
              create user.events.dlq 1
---
# Single replica on purpose: two relays could publish one user's consecutive events
# in parallel and reorder them (see cmd/outbox-relay). Recreate, not RollingUpdate,
# so an upgrade never runs old and new side by side.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: outbox-relay
  labels: {{- include "larper.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: outbox-relay }
  template:
    metadata:
      labels:
        app: outbox-relay
        {{- include "larper.labels" . | nindent 8 }}
    spec:
      containers:
        - name: outbox-relay
          image: {{ .Values.workers.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["/usr/local/bin/outbox-relay"]
          env: {{- include "larper.workerEnv" (dict "root" . "role" "relay") | nindent 12 }}
          resources: {{- toYaml .Values.workers.resources | nindent 12 }}
---
# A consumer group: replicas split user.events' partitions between them, and Kafka
# rebalances when one dies.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taste-worker
  labels: {{- include "larper.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.workers.tasteReplicas }}
  selector:
    matchLabels: { app: taste-worker }
  template:
    metadata:
      labels:
        app: taste-worker
        {{- include "larper.labels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: taste-worker
          image: {{ .Values.workers.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["/usr/local/bin/taste-worker"]
          env: {{- include "larper.workerEnv" (dict "root" . "role" "taste") | nindent 12 }}
          resources: {{- toYaml .Values.workers.resources | nindent 12 }}
---
# Its own identity: on EKS, a Pod Identity association maps this ServiceAccount to
# an IAM role that can use the larper queues (infra/terraform/eks).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ingest-worker
  labels: {{- include "larper.labels" . | nindent 4 }}
---
# Competing consumers on the ingest-area queue. Each job is one geohash5 area; a
# replica holds a renewable lease while it extracts and loads it. Kill a replica
# mid-job and the lease lapses, so the other one picks the job up.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest-worker
  labels: {{- include "larper.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.ingest.replicas }}
  selector:
    matchLabels: { app: ingest-worker }
  template:
    metadata:
      labels:
        app: ingest-worker
        {{- include "larper.labels" . | nindent 8 }}
    spec:
      serviceAccountName: ingest-worker
      containers:
        - name: ingest-worker
          image: {{ .Values.ingest.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            {{- include "larper.dbEnv" (dict "root" . "role" "ingest") | nindent 12 }}
            - { name: OVERTURE_RELEASE, value: {{ .Values.ingest.overtureRelease | quote }} }
            - { name: JOB_LEASE_SECONDS, value: {{ .Values.ingest.leaseSeconds | quote }} }
            - { name: DUCKDB_MEMORY_LIMIT, value: {{ .Values.ingest.duckdbMemory | quote }} }
            - { name: DUCKDB_THREADS, value: {{ .Values.ingest.duckdbThreads | quote }} }
            - { name: PLACE_POSTCODE_PREFIXES, value: {{ .Values.ingest.postcodePrefixes | default "" | quote }} }
            - { name: QUEUE_BACKEND, value: {{ .Values.queue.backend | quote }} }
            {{- if eq .Values.queue.backend "sqs" }}
            - { name: SQS_QUEUE_PREFIX, value: {{ .Values.queue.sqsPrefix | quote }} }
            - { name: AWS_REGION, value: {{ .Values.queue.awsRegion | quote }} }
            {{- if eq .Values.queue.awsAuth "secret" }}
            # IAM user scoped to the larper queues only (infra/terraform/aws), for
            # clusters outside AWS. Created by the deploy script; never committed.
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: aws-sqs, key: access_key_id } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: aws-sqs, key: secret_access_key } }
            {{- end }}
            {{- /* podIdentity: the EKS agent injects short-lived credentials. */}}
            {{- end }}
          resources: {{- toYaml .Values.ingest.resources | nindent 12 }}
