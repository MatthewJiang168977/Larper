# Overrides for the Oracle Always Free target: single-node k3s on an Ampere A1 VM
# (arm64), set up by infra/oci-k3s/bootstrap.sh and deployed by scripts/oci-up.sh with
# values-demo.yaml layered on top (the VM is 1 OCPU / 6 GB; this file alone is sized
# for 2 OCPU / 12 GB). There is no registry: oci-up.sh builds arm64 images and imports
# them straight into k3s's containerd, tagged with the git commit, e.g.
#   --set api.image=larper.local/larper-api:3f9c2e1
# ("larper.local" is not a real registry, so a missing image fails loudly instead of
# being pulled from somewhere else.)

# Imported, never pulled.
imagePullPolicy: IfNotPresent

ingress:
  # k3s's built-in Traefik. Closed by both firewalls unless oci-up.sh runs with
  # PUBLIC_HOST (then 80 and 443 only, HTTPS at that name; infra/oci-k3s/README.md,
  # "Going public"); otherwise reach it through the SSH tunnel oci-up.sh prints.
  className: traefik

api:
  # The public demo ingests on request only in New York City (the five boroughs, the
  # same box as data/extract_overture.py): elsewhere a visitor gets what's loaded.
  ingestRegion: "-74.26,40.49,-73.70,40.92"
  # Visitors reach Traefik directly (no proxy in front), and Traefik sets
  # X-Forwarded-For to the connection's address, keeping it thanks to
  # externalTrafficPolicy Local (bootstrap.sh). "cloudflare" would be wrong here: any
  # client could send its own CF-Connecting-IP and dodge the per-IP limit.
  rateLimit:
    clientIp: forwarded
  hpa:
    # On 2 OCPU: ~1.1 cores requested by the rest of the stack, so three API pods at
    # 300m fit and a fourth would stay Pending. values-demo.yaml takes it to 1-2.
    minReplicas: 2
    maxReplicas: 3

postgres:
  # k3s local-path volumes on the 50 GB boot disk (sizes aren't enforced).
  storage: 4Gi
  backup:
    enabled: true
    # Oracle Object Storage, S3-compatible API. oci-up.sh sets endpointURL from the
    # tenancy's namespace and creates the bucket and the pg-backup-s3 Secret.
    bucket: larper-pg-backups
    # boto3 1.36+ checksums every upload with aws-chunked encoding, which Oracle's S3
    # API refuses ("NotImplemented: AWS chunked encoding not supported"): checksum
    # only where the API requires it. (The SeaweedFS stand-in accepts chunked uploads,
    # so the local rehearsal never hit this.)
    sidecarEnv:
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    # Pings healthchecks.io (Secret backup-check, key pingURL; infra/oci-k3s/README.md).
    check:
      enabled: true

# The shared demo account: "Try the demo" sign-in tokens, and a nightly reset.
# oci-up.sh creates the clerk-demo Secret (infra/oci-k3s/README.md, "The public demo").
demo:
  enabled: true
  email: demo@playlarper.com

redpanda:
  storage: 4Gi

workers:
  tasteReplicas: 1

ingest:
  replicas: 1

queue:
  # Jobs are delivered by Amazon SQS (infra/terraform/aws); the jobs table stays the
  # ledger. Needs the aws-sqs Secret (oci-up.sh creates it).
  backend: sqs

monitoring:
  enabled: true
