# Checks every pull request and every push to main: the API and the web app (typecheck,
# lint, unit tests), the Go workers (gofmt, vet, unit tests), the database tests against a real
# Postgres with PostGIS and pgvector, the Helm chart, and that no committed load-test
# result carries a Clerk session ID or token; gitleaks scans every commit for secrets.
#
# No secrets and no cloud: nothing here deploys, and pull requests from forks run it
# with read-only permissions. It doesn't touch oci-probe.yml (that one only runs on
# its schedule and manual dispatch, in its own concurrency group).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same branch or PR cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (typecheck, lint, unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json's packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @larper/api typecheck
      - run: pnpm --filter @larper/api lint
      # The database specs skip themselves without TEST_DATABASE_URL; the db job runs them.
      - run: pnpm --filter @larper/api test

  web:
    name: Web (typecheck, lint, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @larper/web typecheck
      - run: pnpm --filter @larper/web lint
      # Vitest + Testing Library in jsdom: the home screen's loading, error, empty and
      # surveying states, the location fallback and the API client.
      - run: pnpm --filter @larper/web test

  workers:
    name: Go workers (gofmt, vet, unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: workers/go.mod
          cache-dependency-path: workers/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      # Integration tests skip themselves without TEST_DATABASE_URL; the db job runs them.
      - run: go test ./...

  db:
    name: Database tests (Postgres 17 + PostGIS + pgvector, Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: larper
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
      # The stack's Redis image, for the rate limits' counters (throttle.redis.spec).
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 5s --health-retries 30
    # Roles as on the stack (migration 0010, db/test): migrations run as the owner, each
    # service's tests as that service's role, fixtures and cleanup as the owner. Test
    # passwords, set by db/test/*.sql; nothing here is a real credential.
    env:
      TEST_OWNER_DATABASE_URL: postgres://larper:owner-pw@localhost:5432/larper?sslmode=disable
      TEST_API_DATABASE_URL: postgres://larper_api:api-pw@localhost:5432/larper?sslmode=disable
      TEST_RELAY_DATABASE_URL: postgres://larper_relay:relay-pw@localhost:5432/larper?sslmode=disable
      TEST_TASTE_DATABASE_URL: postgres://larper_taste:taste-pw@localhost:5432/larper?sslmode=disable
      TEST_INGEST_DATABASE_URL: postgres://larper_ingest:ingest-pw@localhost:5432/larper?sslmode=disable
      TEST_BACKUP_CHECK_DATABASE_URL: postgres://larper_backup_check:check-pw@localhost:5432/larper?sslmode=disable
      TEST_DEMO_RESET_DATABASE_URL: postgres://larper_demo_reset:demo-reset-pw@localhost:5432/larper?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      # The stack's image is CloudNativePG's with PostGIS added; this is the same pair
      # of extensions on the stock postgres image, which CI can start as a service.
      - name: Add PostGIS
        run: |
          docker exec ${{ job.services.postgres.id }} sh -c \
            'apt-get update -qq && apt-get install -y -qq --no-install-recommends postgresql-17-postgis-3 >/dev/null'
      # What CNPG does at initdb (the owner, the extensions), plus two of the four
      # service roles created before the migrations, as CNPG may on a fresh install.
      - name: Set up the owner and roles as CloudNativePG does
        run: |
          docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d larper -v ON_ERROR_STOP=1 -q \
            < db/test/before-migrate.sql
      # As the owner, with the same image as the Helm migrate Job. Then the last
      # migration down and up again: re-running it must be clean.
      - name: Apply the migrations (and re-run the last one)
        run: |
          migrate() {
            docker run --rm --network host -v "$PWD/db/migrations:/migrations:ro" migrate/migrate:v4.19.0 \
              -path /migrations -database "$TEST_OWNER_DATABASE_URL" "$@"
          }
          migrate up
          migrate down 1
          migrate up
      - name: Log in the roles the migration created, as CloudNativePG does
        run: |
          docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d larper -v ON_ERROR_STOP=1 -q \
            < db/test/after-migrate.sql
      - uses: actions/setup-go@v5
        with:
          go-version-file: workers/go.mod
          cache-dependency-path: workers/go.sum
      # Queue tests, the stats refresh and the lost-update race test bring their own
      # rows. The Midtown / all-NYC refresh tests skip: they need the NYC places. As the
      # ingest-worker's role, which runs that code.
      - name: Go integration tests
        working-directory: workers
        env:
          TEST_DATABASE_URL: ${{ env.TEST_INGEST_DATABASE_URL }}
        run: go test -count=1 ./internal/...
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Every *.db.spec.ts, as the API's role: the check-in path (brings its own rows),
      # the candidate query, and the roles test (logs in as each role). The candidate
      # query's two 200-pair equivalence checks need the NYC places and the bench's
      # users, so they're skipped here (TEST_NYC_DATA=0) and run locally against the stack.
      # One suite at a time: they share this database, and in parallel one suite's
      # outbox writes, or the roles test's relay session (its last query is the relay's
      # poll), trip another suite's assertDisposableDatabase guard.
      - name: API database tests
        env:
          TEST_DATABASE_URL: ${{ env.TEST_API_DATABASE_URL }}
          TEST_NYC_DATA: '0'
        run: pnpm --filter @larper/api test db.spec --runInBand
      # The rate limits against Redis: counters shared by two API instances, one Lua
      # script per limit window per request, and failing open with Redis unreachable.
      - name: API rate-limit tests (Redis)
        env:
          TEST_REDIS_URL: redis://localhost:6379
        run: pnpm --filter @larper/api test redis.spec

  helm:
    name: Helm chart (lint, render)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.0
      - run: helm lint infra/helm/larper
      # Not Helm, but the other half of the Oracle deploy: the capacity probe must never
      # launch a second larper-k3s (a fake oci CLI; no Oracle account needed).
      - name: OCI probe never launches a second instance
        run: bash scripts/test/oci-capacity-probe.test.sh
      # oci-up.sh fails closed: a check mode never reaches a deploy step (bad CLI values,
      # CRLF, failures), and a dirty tree is refused without --allow-dirty (fake CLIs).
      - name: oci-up.sh fails closed
        run: bash scripts/test/oci-up-guards.test.sh
      - name: Render with each values file
        run: |
          chart=infra/helm/larper
          helm template larper $chart -n larper > /dev/null
          helm template larper $chart -n larper --set monitoring.enabled=true > /dev/null
          helm template larper $chart -n larper -f $chart/values-aks.yaml > /dev/null
          helm template larper $chart -n larper -f $chart/values-eks.yaml > /dev/null
          # oci-up.sh supplies the Object Storage endpoint at deploy time.
          helm template larper $chart -n larper -f $chart/values-oci.yaml \
            --set postgres.backup.endpointURL=https://objectstorage.example.invalid > /dev/null
          # The demo profile is a layer: alone (k3d) and over the Oracle target.
          helm template larper $chart -n larper -f $chart/values-demo.yaml > /dev/null
          helm template larper $chart -n larper -f $chart/values-oci.yaml -f $chart/values-demo.yaml \
            --set postgres.backup.endpointURL=https://objectstorage.example.invalid > /dev/null
          # The Oracle VM at the Always Free maximum (2 OCPU / 12 GB): one more layer.
          helm template larper $chart -n larper -f $chart/values-oci.yaml -f $chart/values-demo.yaml \
            -f $chart/values-oci-a1max.yaml --set postgres.backup.endpointURL=https://objectstorage.example.invalid > /dev/null
          # The public demo (oci-up.sh with PUBLIC_HOST): issuers, edge middlewares, TLS.
          helm template larper $chart -n larper -f $chart/values-oci.yaml -f $chart/values-demo.yaml \
            --set postgres.backup.endpointURL=https://objectstorage.example.invalid \
            --set public.enabled=true --set ingress.host=api.example.com --set public.acme=production \
            --set 'api.cors.origins={https://example.com}' --set clerk.authorizedParties=https://example.com > /dev/null
      # The database roles' connection limits must cover each service at full scale and
      # fit in max_connections (templates/_helpers.tpl): check the chart still refuses.
      - name: Refuse connection limits that don't fit
        run: |
          chart=infra/helm/larper
          refuses() {
            local expect=$1; shift
            if out=$(helm template larper $chart -n larper "$@" 2>&1); then
              echo "rendered, but should have refused: $*"; exit 1
            fi
            grep -q "$expect" <<<"$out" || { echo "unexpected error for $*: $out"; exit 1; }
          }
          refuses 'below pool' -f $chart/values-eks.yaml --set api.hpa.maxReplicas=8
          refuses 'below pool' --set ingest.replicas=3
          refuses 'over max_connections' -f $chart/values-demo.yaml --set postgres.roles.api.connectionLimit=30
          # CORS: exact origins only, and each must be a Clerk authorized party.
          refuses 'is not an origin' --set 'api.cors.origins={*}'
          refuses 'is not an origin' --set 'api.cors.origins={https://larper.example/}'
          refuses "isn't in clerk.authorizedParties" --set 'api.cors.origins={https://larper.example}'
          # Public: never a catch-all host, and only the known certificate modes.
          refuses 'public.enabled needs ingress.host' --set public.enabled=true
          refuses 'public.acme must be' --set public.enabled=true --set ingress.host=api.example.com --set public.acme=prod
      # Rate limits are on unless a load test turns them off: no profile may ship them off.
      - name: Rate limits on in every profile
        run: |
          chart=infra/helm/larper
          oci="-f $chart/values-oci.yaml --set postgres.backup.endpointURL=https://objectstorage.example.invalid"
          for values in "" "-f $chart/values-aks.yaml" "-f $chart/values-eks.yaml" "$oci" \
                        "-f $chart/values-demo.yaml" "$oci -f $chart/values-demo.yaml" \
                        "$oci -f $chart/values-demo.yaml -f $chart/values-oci-a1max.yaml"; do
            # shellcheck disable=SC2086
            helm template larper $chart -n larper $values | grep -q 'name: RATE_LIMIT_ENABLED, value: "1"' ||
              { echo "rate limits off with: ${values:-defaults}"; exit 1; }
          done

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Every commit, not just the latest tree: a key added in one commit and deleted in
      # the next is still in the history (the repo is public).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Default rules plus .gitleaks.toml's allowlist (Clerk publishable keys, which are
      # public by design). Same pinned image as scripts/secret-scan.sh. The checkout
      # belongs to the runner's user, not the container's, hence safe.directory.
      - name: gitleaks
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" --entrypoint sh \
            zricethezav/gitleaks:v8.21.2@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46 \
            -c 'git config --global --add safe.directory /repo &&
                gitleaks detect --source /repo --config /repo/.gitleaks.toml --redact --no-banner -v'

  results:
    name: Load-test results (no session IDs or tokens)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # The check itself must catch a k6 summary with setup_data in it.
      - name: Check that the check fails on a leak
        run: |
          mkdir -p "$RUNNER_TEMP/leak"
          echo '{"metrics":{},"setup_data":{"sessions":["sess_0123456789abcdefghijABCDEFG"]}}' >"$RUNNER_TEMP/leak/summary.json"
          if node loadtest/redact.js --check "$RUNNER_TEMP/leak"; then echo "redact.js --check missed a leak"; exit 1; fi
      - run: node loadtest/redact.js --check loadtest/results

  web-build:
    name: Web (next build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Production calls the API directly at NEXT_PUBLIC_API_URL; the /api proxy is
      # dev-only (next.config.ts). A build without the URL must fail.
      - name: Refuse a production build without NEXT_PUBLIC_API_URL
        run: |
          if out=$(pnpm --filter @larper/web build 2>&1); then
            echo "built without NEXT_PUBLIC_API_URL"; exit 1
          fi
          grep -q "NEXT_PUBLIC_API_URL is not set" <<<"$out" || { echo "$out"; exit 1; }
      # A production build: with Cache Components, a request-time read outside
      # <Suspense> is a build error that dev mode and tsc don't catch (it broke
      # /sign-in). Needs no Clerk keys: nothing at build time talks to Clerk. Then: no
      # rewrites in it, so nothing proxies to the API.
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid
        run: |
          pnpm --filter @larper/web build
          node -e "const r = require('./apps/web/.next/routes-manifest.json').rewrites;
            const n = [r.beforeFiles, r.afterFiles, r.fallback].flat().length;
            if (n) { console.error('production build has rewrites:', JSON.stringify(r)); process.exit(1); }"
