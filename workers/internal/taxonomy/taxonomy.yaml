# Larper niche taxonomy.
#
# Every place gets a vector of `dims` floats. Each tag owns one fixed slot (`id`).
# Slot ids are append-only: never renumber or reuse one, because stored place and
# taste vectors would silently change meaning. Free slots: 150..159.
#
# A tag fires when:
#   - any level of the place's Overture taxonomy hierarchy is in `categories`, or
#   - the place name contains one of `keywords` (case-insensitive, whole words).
# `weight` (default 1.0) scales the slot; the vector is L2-normalized afterwards.
# Places that fire no tag are not quest material and are not loaded.
version: 1
dims: 160

# Keyword rules only apply under these Overture roots, so "Matcha Dental" stays out.
roots: [food_and_drink, shopping, arts_and_entertainment, sports_and_recreation,
        lifestyle_services, cultural_and_historic, lodging, travel_and_transportation]

